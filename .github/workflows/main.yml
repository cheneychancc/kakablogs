name: Deploy Frontend

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 关键步骤：直接调用原生的 docker 命令
      - name: Build with Native Docker
        run: |
          # 1. 运行 node 容器进行编译
          # --rm: 运行完自动删除容器
          # -v: 将当前 GitHub Actions 的工作目录映射到容器内的 /app
          # -w: 指定容器内的工作目录为 /app
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            node:18.16.0 \
            sh -c "npm install && npm run docs:build && chown -R $(id -u):$(id -g) ."

      # 2. 部署（依然在宿主机执行）
      - name: Copy to Target
        run: |
          TARGET_DIR=/var/www/blogs/prod
          sudo mkdir -p $TARGET_DIR
          
          # 判断产物路径并拷贝
          if [ -d ".vitepress/dist" ]; then
            SOURCE=".vitepress/dist/"
          else
            SOURCE="dist/"
          fi
          
          sudo rm -rf $TARGET_DIR/*
          sudo cp -r $SOURCE* $TARGET_DIR/
          echo "部署完成"
